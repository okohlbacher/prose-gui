# The ProSE desktop app on Linux: the pinned OpenMS (native/OPENMS_COMMIT) built and bundled, the app's unit
# tests, the .deb and the AppImage, and the AppImage's smoke test (the example with PeptDeep through WebDriver).
# A tag desktop-native-v* makes a draft release with the two packages of the tested prose-desktop run of the
# tagged commit (a tag run builds nothing: the caches below belong to the branch, and a tag run cannot read
# them, so it would build OpenMS and its dependencies from scratch).
#
# Caches (actions/cache): the bundled ProSE (src-tauri/resources/prose), keyed by the pin and the two scripts
# that make it, so OpenMS is built only when one of them changes; and vcpkg's binary cache, keyed by the pin
# and the triplet (plus the hash of its content when saved), so a rebuild of OpenMS does not rebuild its
# dependencies. Both are saved right after the step that fills them, so a later failure (tests, packaging)
# does not lose hours of building.
name: desktop

on:
  push:
    branches: [prose-desktop]
    tags: ['desktop-native-v*']
  pull_request:
    branches: [prose-desktop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  # an OpenMS build can take hours; a newer push waits instead of cancelling it
  cancel-in-progress: false

env:
  TRIPLET: x64-linux-dynamic

jobs:
  linux:
    name: Linux (ubuntu-22.04)
    # a tag takes the packages of the branch run instead (the release job)
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    # the first run builds vcpkg's dependencies (Arrow, the AWS SDK, ONNX Runtime, ...) and OpenMS
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: The OpenMS pin
        id: pin
        run: |
          commit=$(tr -d '[:space:]' < native/OPENMS_COMMIT)
          [[ $commit =~ ^[0-9a-f]{40}$ ]] || { echo "native/OPENMS_COMMIT holds no commit hash" >&2; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Restore the bundled ProSE
        id: bundle
        uses: actions/cache/restore@v6
        with:
          path: src-tauri/resources/prose
          key: prose-bundle-v1-ubuntu-22.04-${{ env.TRIPLET }}-${{ steps.pin.outputs.commit }}-${{ hashFiles('native/scripts/build-openms.sh', 'native/scripts/bundle-prose.sh') }}

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            webkit2gtk-driver xvfb xauth file patchelf

      # --- OpenMS (only without a bundle in the cache) ------------------------------------------------
      - name: Disk space and build tools for OpenMS
        if: steps.bundle.outputs.cache-hit != 'true'
        run: |
          # the runner image's SDKs the build does not need; vcpkg's build trees and OpenMS need the room
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          df -h /
          # OpenMS needs GCC 13 (C++23); Ubuntu 22.04 has GCC 11 and 12
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-13 g++-13 \
            autoconf autoconf-archive automake libtool ninja-build pkg-config bison flex curl zip unzip tar
          cmake --version
          gcc-13 --version

      # ONNX Runtime's MLAS has AVX-NE-CONVERT code (cvtfp16Avx.S) that needs GNU as >= 2.40; Ubuntu 22.04
      # has binutils 2.38. Only the assembler is built (2.42, as on Ubuntu 24.04) and given to GCC through
      # COMPILER_PATH; the linker stays the system's.
      - name: GNU as 2.42
        if: steps.bundle.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLO https://ftpmirror.gnu.org/binutils/binutils-2.42.tar.xz
          echo "f6e4d41fd5fc778b06b7891457b3620da5ecea1006c6a4a41ae998109f85a800  binutils-2.42.tar.xz" | sha256sum -c -
          tar xf binutils-2.42.tar.xz
          mkdir gas-build
          cd gas-build
          ../binutils-2.42/configure --disable-nls --disable-werror --disable-gprofng --disable-gold --disable-gdb --disable-sim > configure.log
          make -j4 MAKEINFO=true all-gas > make.log
          mkdir -p "$RUNNER_TEMP/gas"
          cp gas/as-new "$RUNNER_TEMP/gas/as"
          printf 'vcvtneeph2ps (%%rdi), %%ymm0\n' > avxneconvert.s
          "$RUNNER_TEMP/gas/as" avxneconvert.s -o avxneconvert.o
          echo 'int main(void) { return 0; }' > main.c
          COMPILER_PATH="$RUNNER_TEMP/gas" gcc-13 -v -c main.c -o main.o 2>&1 | grep -F "$RUNNER_TEMP/gas/as"

      - name: Check out OpenMS at the pin
        if: steps.bundle.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: OpenMS/OpenMS
          ref: ${{ steps.pin.outputs.commit }}
          path: openms
          persist-credentials: false

      - name: vcpkg (the OpenMS submodule)
        if: steps.bundle.outputs.cache-hit != 'true'
        run: git -C openms submodule update --init --depth 1 vcpkg

      - name: Restore vcpkg's binary cache
        if: steps.bundle.outputs.cache-hit != 'true'
        id: vcpkg
        uses: actions/cache/restore@v6
        with:
          path: vcpkg-bincache
          # saved below as <this key>-<hash of the content>: the newest cache of the pin, else of an earlier pin
          key: vcpkg-v1-ubuntu-22.04-${{ env.TRIPLET }}-${{ steps.pin.outputs.commit }}
          restore-keys: |
            vcpkg-v1-ubuntu-22.04-${{ env.TRIPLET }}-${{ steps.pin.outputs.commit }}-
            vcpkg-v1-ubuntu-22.04-${{ env.TRIPLET }}-

      - name: Build OpenMS (libOpenMS and ProSE)
        if: steps.bundle.outputs.cache-hit != 'true'
        id: openms
        env:
          CC: gcc-13
          CXX: g++-13
          JOBS: 4
          VCPKG_MAX_CONCURRENCY: 4
          VCPKG_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
          VCPKG_INSTALL_OPTIONS: --clean-after-build
          OPENMS_TARGETS: OpenMS ProSE
        run: |
          export COMPILER_PATH=$RUNNER_TEMP/gas PATH=$RUNNER_TEMP/gas:$PATH
          native/scripts/build-openms.sh openms openms/build
          df -h /

      # saved whatever happened to OpenMS, with the hash of its content in the key: the packages vcpkg built
      # are kept even if a later one or OpenMS failed, and an unchanged cache is not saved again
      - name: Save vcpkg's binary cache
        if: always() && steps.bundle.outputs.cache-hit != 'true' && hashFiles('vcpkg-bincache/**') != ''
        uses: actions/cache/save@v6
        with:
          path: vcpkg-bincache
          key: ${{ steps.vcpkg.outputs.cache-primary-key }}-${{ hashFiles('vcpkg-bincache/**') }}

      - name: Bundle ProSE
        if: steps.bundle.outputs.cache-hit != 'true'
        run: native/scripts/bundle-prose.sh openms/build src-tauri/resources/prose

      - name: Save the bundled ProSE
        if: steps.bundle.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: src-tauri/resources/prose
          key: ${{ steps.bundle.outputs.cache-primary-key }}

      # --- the app ----------------------------------------------------------------------------------------
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: npm ci, tauri-driver
        run: |
          npm ci
          command -v tauri-driver || cargo install tauri-driver --locked

      - name: The bundled ProSE
        run: |
          cat src-tauri/resources/prose/build.json
          src-tauri/resources/prose/bin/ProSE --help 2>&1 | grep -m1 'Version:'
          du -sh src-tauri/resources/prose src-tauri/resources/prose/lib src-tauri/resources/prose/share

      - name: Unit tests (svelte-check, vitest)
        run: |
          npm run check
          npm test

      - name: Unit tests (cargo test, with the bundled ProSE)
        working-directory: src-tauri
        env:
          PROSE_BIN: ${{ github.workspace }}/src-tauri/resources/prose/bin/ProSE
          PROSE_EXAMPLE_DIR: ${{ github.workspace }}/src-tauri/resources/example
        run: cargo test --locked

      - name: Packages (.deb, AppImage)
        run: native/scripts/package-linux.sh

      - name: Smoke test of the AppImage
        run: |
          hide=()
          [ -d openms/build ] && hide=(--hide-openms openms/build)
          native/scripts/smoke-appimage.sh src-tauri/target/release/bundle/appimage/*.AppImage "${hide[@]}"

      - name: Package sizes
        if: always()
        run: |
          {
            echo '### Packages'
            echo
            echo '| file | size |'
            echo '| --- | --- |'
            for f in src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb; do
              if [ -f "$f" ]; then echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; fi
            done
            if [ -f src-tauri/resources/prose/build.json ]; then
              echo "| (bundled ProSE, unpacked) | $(du -sh src-tauri/resources/prose | cut -f1) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: prose-desktop-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  # A draft release of the two packages, for a tag desktop-native-v* only; publishing it is a person's step. The
  # packages are those of the successful prose-desktop run of the tagged commit, the build that ran the unit
  # tests and the smoke test (artifacts are kept 14 days; an older run can be re-run with `gh run rerun`).
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/desktop-native-v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: The packages of the tested branch run of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          run=$(gh run list --workflow desktop.yml --branch prose-desktop --commit "$SHA" --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run" ]; then
            echo "::error::No successful run of desktop.yml on prose-desktop for $SHA. Tag a commit of prose-desktop whose run passed (or wait for its run to finish)."
            exit 1
          fi
          echo "packages of run $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$run"
          if ! gh run download "$run" --name prose-desktop-linux --dir packages; then
            echo "::error::Run $run has no artifact prose-desktop-linux (expired after 14 days?): re-run it with 'gh run rerun $run', then this job."
            exit 1
          fi
          find packages -type f -printf '%s\t%p\n'
          [ -n "$(find packages -type f -name '*.AppImage')" ] && [ -n "$(find packages -type f -name '*.deb')" ] \
            || { echo "::error::run $run's artifact lacks the AppImage or the .deb"; exit 1; }
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          ProSE desktop for Linux x64 (Ubuntu 22.04 or later): the AppImage runs as is, the .deb installs with apt.

          The AppImage needs the system's OpenGL ES library, libGLESv2.so.2 (the .deb pulls it in with WebKitGTK).
          Desktop installations have it; without it the app exits at once (exit code 127, "Couldn't open
          libGLESv2.so.2"). Install it with
          - Ubuntu, Debian: `sudo apt install libgles2`
          - Fedora: `sudo dnf install libglvnd-gles`
          NOTES
          gh release create "$TAG" --draft --verify-tag --title "ProSE desktop ${TAG#desktop-native-v}" \
            --notes-file notes.md $(find packages -type f \( -name '*.AppImage' -o -name '*.deb' \))

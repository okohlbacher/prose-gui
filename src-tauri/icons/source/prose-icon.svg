<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- ProSE: the OpenMS mirrored spectrum (its gradient, orange to blue) seen through a search lens, on OpenMS ink -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="40" x2="394" y1="0" y2="0">
      <stop offset="0" stop-color="#ffb401"/>
      <stop offset=".22" stop-color="#ff7501"/>
      <stop offset=".54" stop-color="#ff03cb"/>
      <stop offset=".77" stop-color="#b503ff"/>
      <stop offset="1" stop-color="#3157e9"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="452" cy="452" r="232"/></clipPath>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="#231f20"/>
  <!-- the mirror: peaks above the axis, the prediction below -->
  <g clip-path="url(#lens)" fill="url(#g)">
    <g transform="translate(235 0)">
      <rect x="40"  y="372" width="34" height="80" rx="8"/>
      <rect x="104" y="262" width="34" height="190" rx="8"/>
      <rect x="168" y="332" width="34" height="120" rx="8"/>
      <rect x="232" y="232" width="34" height="220" rx="8"/>
      <rect x="296" y="302" width="34" height="150" rx="8"/>
      <rect x="360" y="392" width="34" height="60" rx="8"/>
      <rect x="40"  y="472" width="34" height="60" rx="8" opacity=".5"/>
      <rect x="104" y="472" width="34" height="150" rx="8" opacity=".5"/>
      <rect x="168" y="472" width="34" height="100" rx="8" opacity=".5"/>
      <rect x="232" y="472" width="34" height="180" rx="8" opacity=".5"/>
      <rect x="296" y="472" width="34" height="120" rx="8" opacity=".5"/>
      <rect x="360" y="472" width="34" height="40" rx="8" opacity=".5"/>
    </g>
  </g>
  <!-- the lens and its handle -->
  <circle cx="452" cy="452" r="252" fill="none" stroke="#f5f5f5" stroke-width="40"/>
  <path d="M640 640 L820 820" stroke="#f5f5f5" stroke-width="72" stroke-linecap="round"/>
</svg>

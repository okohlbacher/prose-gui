[package]
name = "prose-desktop"
version = "0.1.4"
description = "ProSE desktop: the OpenMS search engine, with the look of the ProSE web app"
edition = "2021"
license = "BSD-3-Clause"
default-run = "prose-desktop"

[lib]
name = "prose_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the check of an .mzML.gz (src/content.rs) and the project zip, written entry by entry (src/project.rs); both are in
# the lock file already (through Tauri)
flate2 = "1"
crc32fast = "1"

[features]
# `tauri build` turns this on: the app then serves the built frontend instead of the dev server
custom-protocol = ["tauri/custom-protocol"]
